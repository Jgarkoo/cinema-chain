<div class="comming-soon">
  <div class="comming-soon-header">
    <h2>
      COMMING SOON...
    </h2>
    <a>
      See all
    </a>
  </div>
  <div class="comming-soon-movies">
    @for (movie of commingsoonMovies(); track movie.id; let index = $index) {
      <div class="comming-Soon-Movie" [class.comming-Soon-Fade]="index === 3">
        <img [src]="movie.backdropUrl" [alt]="movie.title">
        <div class="movie-descript">
          <h1>IN CINEMAS {{ formatReleaseDate(movie.releaseDate) }}</h1>
          <h3>{{ movie.title }}</h3>
          <p>Thriller • {{ movie.runtimeMinutes }} Min</p>
          <p class="age-rating">
            {{ movie.ageRating.minAge}}
          </p>
        </div>
      </div>
    }
  </div>
</div>
