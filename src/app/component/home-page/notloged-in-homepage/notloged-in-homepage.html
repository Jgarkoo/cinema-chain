<div class="container">
  <header>
    <div class="logo-section">
      <a [routerLink]="['/home-page']">
        <img src="/img/Frame.png" alt="Kino XII">
        <span>SESSIONS</span>
      </a>
    </div>
    <div class="header-right">
      <div class="search-bar">
        <span class="search-icon">
          <svg fill="#ffffff" width="12px" height="12px" viewBox="0 -0.24 28.423 28.423"
               id="_02_-_Search_Button" data-name="02 - Search Button"
               xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
            <g id="SVGRepo_iconCarrier"> <path id="Path_215" data-name="Path 215" d="M14.953
            ,2.547A12.643,12.643,0,1,0,27.6,15.19,12.649,12.649,0,0,0,14.953,2.547Zm0,2A10.643,
            10.643,0,1,1,4.31,15.19,10.648,10.648,0,0,1,
            14.953,4.547Z" transform="translate(-2.31 -2.547)"fill-rule="evenodd"></path>
              <path id="Path_216" data-name="Path 216" d="M30.441,28.789l-6.276-6.276a1,
              1,0,1,0-1.414,1.414L29.027,30.2a1,1,
              0,1,0,1.414-1.414Z" transform="translate(-2.31 -2.547)" fill-rule="evenodd"></path></g>
          </svg>
        </span>
        <input
          type="text"
          placeholder="Search films and live events"
        >
      </div>
      <button
        class="sign-up-button"
        routerLink="/log-in"
        [queryParams]="{ mode: 'register' }"
      >
        Sign up
      </button>
      <button
        class="log-in-button"
        routerLink="/log-in"
        [queryParams]="{ mode: 'login' }"
      >
        Log in
      </button>
    </div>
  </header>
  <div class="futuredFilm-main">
    <app-futured-films #futuredFilms>

    </app-futured-films>
  </div>
  <div class="films-main">
    <app-now-playing #nowPlaying>

    </app-now-playing>
  </div>
  <div class="soon-commingMovies-main">
    <app-comming-soon #upcomingFilms>

    </app-comming-soon>
  </div>
  <footer>
    <div class="footer-div">
      <img src="/img/Frame.png" alt="Kino XII">
      <p>
        © 2026 Kino XII. All rights reserved.
      </p>
    </div>
  </footer>
</div>
