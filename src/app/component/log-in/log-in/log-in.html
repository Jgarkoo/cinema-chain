<div class="container">
  @if (showLogin) {
    <div class="login-formField">
      <app-log-in-form></app-log-in-form>
      <p>
        Don't have an account?
        <a (click)="showRegister()">Sign up</a>
      </p>
    </div>
  }
  @else {
    <div class="signup-formField">
      <app-register-form></app-register-form>
      <p>
        Already have an account?
        <a (click)="showLoginForm()">Log in</a>
      </p>
    </div>
  }
</div>
