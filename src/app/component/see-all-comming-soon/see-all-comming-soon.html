<div class="coming-soon-allMovies">
  <div class="coming-Soon-Header">
    <a [routerLink]="['/home-page']">‹</a>
    <h1>
      COMING SOON
    </h1>
  </div>
  <div class="coming-soon-main">
    @for (movie of comingSoonMoveis(); track movie.id;) {
      <div class="coming-Soon-Movie">
        <img [src]="movie.backdropUrl" [alt]="movie.title">
        <div class="movie-descript">
          <h1>IN CINEMAS {{ formatReleaseDate(movie.releaseDate) }}</h1>
          <h3>{{ movie.title }}</h3>
          <p>Thriller • {{ movie.runtimeMinutes }} Min</p>
          <p class="age-rating">
            {{ movie.ageRating.minAge}}
          </p>
          <button
            type="button"
            class="notify-btn"
            [class.notified]="isNotified(movie)"
            [disabled]="isPending(movie)"
            (click)="notify(movie)"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
            </svg>
            {{ isNotified(movie) ? "We'll notify you" : 'Notify Me' }}
          </button>
        </div>
      </div>
    }
  </div>
</div>
