<div class="now-playing-allMovies">
    <div class="now-Playing-Header">
      <a [routerLink]="['/home-page']">‹</a>
      <h1>
        NOW PLAYING
      </h1>
    </div>
  <div class="now-playing-main">
    @for (movie of nowPlayingMovies(); track movie.id;) {
      <div class="now-Playing-Movies">
        <img [src]="movie.backdropUrl" [alt]="movie.title">
        <h3>{{ movie.title }}</h3>
        <p>Thriller • {{ movie.runtimeMinutes }} Min</p>
        <p class="age-rating">
          {{ movie.ageRating.minAge}}
        </p>
        <div class="movie-price">
          <p>
            From ₾ {{movie.fromPrice}}
          </p>
          <button type="button" (click)="buyTicket(movie)">
            Buy Ticket
          </button>
        </div>
      </div>
    }
  </div>
</div>
